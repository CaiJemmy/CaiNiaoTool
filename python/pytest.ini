[pytest]
pythonpath =
    .
    src
testpaths = tests

# 指定报告生成目录
addopts =
    --durations=0
    --html=reports/report/test-report.html
    --junitxml=reports/report/junit-report.xml
    --cov-report=term-missing
    --cov-config=.coveragerc

# 忽略覆盖率相关警告
filterwarnings =
    ignore::pytest_cov.plugin.CovReportWarning
    ignore::coverage.misc.CoverageWarning
    ignore::UserWarning
