# ==================================================
# HAProxy 配置 - MySQL 负载均衡
# ==================================================

global
    log stdout format raw local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

    # SSL 配置 (如需要)
    # ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384
    # ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    option  redispatch
    retries 3
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms
    timeout check   2000ms

# ==================================================
# 统计页面
# ==================================================
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-node
    stats show-legends
    stats auth admin:Admin@123456

# ==================================================
# MySQL Master (写操作)
# ==================================================
listen mysql-master
    bind *:3306
    mode tcp
    balance roundrobin
    option mysql-check user haproxy_check

    # Master 服务器
    server mysql-master mysql-master:3306 check inter 5000 rise 2 fall 3

# ==================================================
# MySQL Slaves (读操作)
# ==================================================
listen mysql-slaves
    bind *:3307
    mode tcp
    balance leastconn
    option mysql-check user haproxy_check

    # Slave 服务器
    server mysql-slave1 mysql-slave1:3306 check inter 5000 rise 2 fall 3 weight 1
    server mysql-slave2 mysql-slave2:3306 check inter 5000 rise 2 fall 3 weight 1

    # 备用 Master (权重为0，仅在所有 Slave 故障时使用)
    server mysql-master mysql-master:3306 check inter 5000 rise 2 fall 3 weight 0 backup
