# ==================================================
# Prometheus 配置 - MySQL 集群监控
# ==================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mysql-production'
    environment: 'production'

# Alertmanager 配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# 告警规则文件
rule_files:
  - '/etc/prometheus/rules/*.yml'

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MySQL Master Exporter
  - job_name: 'mysql-master'
    static_configs:
      - targets: ['mysql-exporter-master:9104']
        labels:
          instance: 'mysql-master'
          role: 'master'
          cluster: 'mysql-production'

  # MySQL Slave1 Exporter
  - job_name: 'mysql-slave1'
    static_configs:
      - targets: ['mysql-exporter-slave1:9104']
        labels:
          instance: 'mysql-slave1'
          role: 'slave'
          cluster: 'mysql-production'

  # MySQL Slave2 Exporter
  - job_name: 'mysql-slave2'
    static_configs:
      - targets: ['mysql-exporter-slave2:9104']
        labels:
          instance: 'mysql-slave2'
          role: 'slave'
          cluster: 'mysql-production'

  # HAProxy
  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy:8404']
        labels:
          cluster: 'mysql-production'

  # ProxySQL
  - job_name: 'proxysql'
    static_configs:
      - targets: ['proxysql:6070']
        labels:
          cluster: 'mysql-production'

  # Docker 容器监控（可选）
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
