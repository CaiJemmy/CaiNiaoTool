[agent]
  interval = "10s"
  flush_interval = "5s"

# 从 cAdvisor 的 /metrics 抓取 Prometheus 格式数据
[[inputs.prometheus]]
  urls = ["http://cadvisor:8080/metrics"]

# 可以同时采集宿主机基础指标（可选）
[[inputs.cpu]]
[[inputs.mem]]
[[inputs.disk]]

# 写入 InfluxDB
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "cadvisor"
  username = "grafana"
  password = "grafana123"
  skip_database_creation = false
